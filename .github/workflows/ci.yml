name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifest
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          sha256sum -c ADMITTED.sha256
          echo 'a82fcf97f95f6f6f7707a4890e786cd6c8ea39f0b07fbe1036fc2df73e4e0a7d  records/R6-flat-sheet/verify_1d.log' | sha256sum -c -
          echo 'e6cf2a2c069c2fca381294a2d4286940401db5f5ab1aecb6960e83cf007ca3cb  records/R7-flat-sheet-certificate/cert_default.log' | sha256sum -c -
          echo '69e8a8dc372b7c0158d3614db59d220ee682968885680daef7bcf1dad23a9e64  records/R7-flat-sheet-certificate/independent_nk24_m200_rerun.log' | sha256sum -c -
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.5 scipy==1.18.1 sympy==1.14.0 mpmath==1.3.0 python-flint
      - name: R0 scalar ceiling replay
        working-directory: records/R0-scalar-ceiling
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF 'PASS replay: all five relative-width targets and gamma=2 absolute width' replay.out
          grep -qF 'CERTIFIED gamma=2 T_lin/g rounds to 0.18272624777232952' replay.out
      - name: R1 inflated comparison and exact algebra
        working-directory: records/R1-local-skeleton
        run: |
          set -euo pipefail
          python -B check_exact.py | tee replay.out
          grep -qF 'exact algebra replay: signed form, row moments, rational guards, three mutants' replay.out
      - name: R2 signed form, forward margin and independent checks
        run: |
          set -euo pipefail
          cd records/R2-signed-form
          python -B replay_form.py | tee form.out
          grep -qF 'six mutants rejected' form.out
          python -B replay_bounds.py | tee bounds.out
          grep -qF 'Exact forward margin 55/262144 > 1/8192' bounds.out
          cd review
          python -B independent_checks.py | tee independent.out
          grep -qF 'Independent exact polynomial, one-static limit, and rational guards agree' independent.out
      - name: R3 onset replay and independent checks
        run: |
          set -euo pipefail
          cd records/R3-onset
          python -B replay.py | tee replay.out
          grep -qF 'Mutant rejected' replay.out
          cd review
          python -B independent_checks.py | tee independent.out
          grep -qF 'Overlap strictly below join; both small-x norm bounds fit Young ball' independent.out
      - name: R4 gap, grid receipts and independent checks
        run: |
          set -euo pipefail
          cd records/R4-gap-grid
          python -B replay.py | tee grid.out
          grep -qF 'GRID certified=54/135' grid.out
          grep -qF 'MUTANTS rejected=5' grid.out
          python -B finite_check.py | tee finite-check.out
          grep -qF 'FINITE CHECK inverse-moment rational rounding fixture PASS' finite-check.out
          python -B radial_check.py | tee radial-check.out
          grep -qF 'RADIAL FIXTURES PASS: 3/3 mutants rejected' radial-check.out
          python -B finite.py --published | tee finite.out
          grep -qF 'FINITE PASS worst pairing upper<=0.50417617; unresolved=44' finite.out
          python -B grid_receipts.py logs | tee receipts.out
          grep -qF 'phase3_historical_receipt_union: pairing<=0.72827964 preconditioned_normal_map_G_q<=0.70929592' receipts.out
          cd review
          python -B independent_checks.py | tee independent.out
          grep -qF 'near-static: max residual/x <=' independent.out
      - name: R6 flat-sheet replay and formula mutants
        working-directory: records/R6-flat-sheet
        run: |
          set -euo pipefail
          python -B replay.py | tee replay.out
          grep -qF "'status': 'CERTIFIED'" replay.out
          grep -qF "'flat_sheet_exact_CERTIFIED': '9/4'" replay.out
          grep -qF '[NUMERICAL] 1D residue 2D-FFT err' replay.out
          grep -qF '[NUMERICAL circle + CERTIFIED flat] 2D overlap' replay.out
          for m in layer_cake_factor u_floor residue_sign no_decay; do
            if python -B replay.py --mutate "$m" > "mutant-$m.out" 2>&1; then
              echo "mutant $m was accepted; the guard is missing"
              exit 1
            fi
            grep -q 'AssertionError' "mutant-$m.out"
            echo "mutant $m refused"
          done
      - name: Public prose safeguards
        run: |
          set -euo pipefail
          if git ls-files | grep -nE '(^|/)(REVIEW|FIX|SCOPING)[^/]*\.(md|txt)$|(^|/)(REVIEW|FIX)[^/]*\.md$|\.v[12]\.(tex|md|py)$'; then
            echo 'review-cycle files must not be in the tree'
            exit 1
          fi
          if grep -nE '—|\b(G1-[A-Z]+|MS-VERTEX|VERTEX-UNIV|ADIABATIC|EXTHOL|HUBHOL)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/t|\bMac\b|\blane\b|reserved DOI' paper/main.tex README.md CLAIMS.md BUILD.md CITATION.cff records/R6-flat-sheet/RIGOR.md records/R6-flat-sheet/RESULT.md; then exit 1; fi
          grep -qF 'This preprint has not been peer reviewed.' paper/main.tex
          grep -qF 'This preprint has not been peer reviewed.' README.md
          grep -qF '10.5281/zenodo.24410274' paper/main.tex
          grep -qF '10.5281/zenodo.24410273' paper/main.tex
          grep -qF '10.5281/zenodo.24415577' README.md
          grep -qF '10.5281/zenodo.24415572' README.md
          grep -qF '10.5281/zenodo.24410274' README.md
          grep -qF '10.5281/zenodo.24410273' README.md
          grep -qF "orcid.org/0000-0001-5839-5197" README.md CITATION.cff
  r7-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned certificate dependencies
        run: python -m pip install --disable-pip-version-check mpmath==1.4.1 numpy==2.5.5 scipy==1.18.1 python-flint==0.9.0 gmpy2==2.3.2
      - name: R7 default certificate
        working-directory: records/R7-flat-sheet-certificate
        run: |
          set -euo pipefail
          python -B cert.py | tee cert.out
          test "$(grep -cF 'CERTIFIED  (all inequalities hold)' cert.out)" -eq 2
          test "$(grep -cF 'k < 1 -> True' cert.out)" -eq 2
          python - <<'EOF'
          # Checked numerically with a fixed slack: the enclosure lower bounds move only in their
          # last digits across platforms, and the fixed-point radius depends on the floating
          # candidate, so exact strings would make the job tied to one machine.
          import re
          t = open('cert.out', encoding='utf-8').read()
          lam = [float(x) for x in re.findall(r'lambda_max >= ([0-9.]+)', t)]
          imu = [float(x) for x in re.findall(r'min \|Im u\| >= ([0-9.]+)', t)]
          rad = [float(x) for x in re.findall(r'unique fixed point in \|\|Sigma-Sigma_0\|\|_inf <= ([0-9.E+-]+)', t)]
          assert len(lam) == len(imu) == len(rad) == 2, (lam, imu, rad)
          assert lam[0] >= 1.0057975124 and lam[1] >= 1.0199337112, lam
          assert imu[0] >= 0.056577681803 and imu[1] >= 0.038415264890, imu
          assert rad[0] <= 5.834e-17 and rad[1] <= 3.638e-17, rad
          print('lambda_max', lam, 'min |Im u|', imu, 'fixed-point radii', rad, 'within bounds')
          EOF
      - name: R7 second-checker self-tests
        working-directory: records/R7-flat-sheet-certificate
        run: |
          set -euo pipefail
          python -B independent.py --selftest | tee independent-selftest.out
          grep -qF 'containment failures 0, width failures 0' independent-selftest.out
          python -B independent.py --selftest-gap | tee independent-selftest-gap.out
          grep -qF -- '-> PASS' independent-selftest-gap.out
      - uses: actions/upload-artifact@v4
        with:
          name: r7-flat-sheet-certificate-run
          path: |
            records/R7-flat-sheet-certificate/cert.out
            records/R7-flat-sheet-certificate/independent-selftest.out
            records/R7-flat-sheet-certificate/independent-selftest-gap.out
          if-no-files-found: error
  flat-sheet-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned replay dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.5 scipy==1.18.1
      - name: Flat-sheet solver
        working-directory: records/R6-flat-sheet
        run: |
          set -euo pipefail
          python -B verify_1d_counterexample.py > run.log 2>&1
          cat run.log
          grep -qF '=> extrap=1.004245' run.log
          grep -qF '=> extrap=1.013678' run.log
          grep -qF '=> extrap=1.014628' run.log
          grep -qF 'rq_lo=1.0090706553' run.log
          grep -qF 'rq_lo=1.0123025473' run.log
      - uses: actions/upload-artifact@v4
        with:
          name: r6-flat-sheet-solver-log
          path: records/R6-flat-sheet/run.log
          if-no-files-found: error
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: "1795132800"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Undefined|Citation.*undefined|There were undefined' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24410274' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24410273' urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/vertex-corrections-migdal-eliashberg-ceiling' urls.txt
          pdftotext main.pdf main.txt
          if grep -nE '—|---|\b(G1-[A-Z]+|MS-VERTEX|VERTEX-UNIV|ADIABATIC|EXTHOL|HUBHOL)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/t|\bMac\b|\blane\b' main.txt; then exit 1; fi
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'This preprint has not been peer reviewed.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'Separate AI agents performed the independent reviews.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'Davis Rens'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '0000-0001-5839-5197'
      - uses: actions/upload-artifact@v4
        with:
          name: vertex-corrections-migdal-eliashberg-ceiling-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
          if-no-files-found: error
